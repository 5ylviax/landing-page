name: Portfolio CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: portfolio-publish
  cancel-in-progress: false

jobs:
  build-test-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t ghcr.io/5ylviax/portfolio:latest .

      - name: Test Docker container
        run: |
          docker run -d --name portfolio-test -p 127.0.0.1:4002:8000 ghcr.io/5ylviax/portfolio:latest

          curl --fail --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 2 \
            --max-time 10 \
            http://127.0.0.1:4002/

      - name: Show container logs on failure
        if: failure()
        run: docker logs portfolio-test || true